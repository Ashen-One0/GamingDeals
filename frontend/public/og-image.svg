<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background: Obsidian black with tactical noise -->
  <defs>
    <radialGradient id="glow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#D4FF00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#FF2A4D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#27272A"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#09090B"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.6"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Logo badge -->
  <rect x="80" y="80" width="80" height="80" fill="#D4FF00"/>
  <text x="120" y="138" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="#09090B" text-anchor="middle">GD</text>

  <!-- Brand name -->
  <text x="180" y="130" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF">GamingDeals</text>

  <!-- Eyebrow tag -->
  <rect x="80" y="240" width="350" height="36" fill="none" stroke="#D4FF00" stroke-width="1"/>
  <rect x="80" y="240" width="350" height="36" fill="#D4FF00" fill-opacity="0.1"/>
  <text x="100" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#D4FF00" letter-spacing="3">PRICE INTELLIGENCE FOR GAMERS</text>

  <!-- Main headline -->
  <text x="80" y="370" font-family="Arial Black, sans-serif" font-size="86" font-weight="900" fill="#FFFFFF" letter-spacing="-2">Never miss a</text>
  <text x="80" y="460" font-family="Arial Black, sans-serif" font-size="86" font-weight="900" fill="#FFFFFF" letter-spacing="-2">game sale.</text>

  <!-- Platforms strip -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#A1A1AA" letter-spacing="2">
    <rect x="80" y="520" width="90" height="30" fill="none" stroke="#27272A"/>
    <text x="125" y="540" text-anchor="middle">STEAM</text>
    <rect x="180" y="520" width="80" height="30" fill="none" stroke="#27272A"/>
    <text x="220" y="540" text-anchor="middle">EPIC</text>
    <rect x="270" y="520" width="80" height="30" fill="none" stroke="#27272A"/>
    <text x="310" y="540" text-anchor="middle">GOG</text>
    <rect x="360" y="520" width="140" height="30" fill="none" stroke="#27272A"/>
    <text x="430" y="540" text-anchor="middle">PLAYSTATION</text>
    <rect x="510" y="520" width="80" height="30" fill="none" stroke="#27272A"/>
    <text x="550" y="540" text-anchor="middle">XBOX</text>
  </g>

  <!-- Right-side stats card -->
  <rect x="820" y="180" width="300" height="120" fill="#18181B" stroke="#27272A"/>
  <text x="840" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#A1A1AA" letter-spacing="3">LIVE DEALS</text>
  <text x="840" y="280" font-family="Arial Black, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">100K+</text>

  <rect x="820" y="320" width="300" height="120" fill="#D4FF00"/>
  <text x="840" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#09090B" letter-spacing="3">PEAK DISCOUNT</text>
  <text x="840" y="420" font-family="Arial Black, sans-serif" font-size="64" font-weight="900" fill="#09090B">-90%</text>

  <!-- Bottom corner accent -->
  <rect x="80" y="600" width="40" height="4" fill="#D4FF00"/>
</svg>
